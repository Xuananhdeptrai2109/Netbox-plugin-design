name: CI Pipeline

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  lint-and-syntax:
    name: Python Lint & Syntax Check
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 black

      - name: Check Python Syntax (Compile all .py files)
        run: |
          python -m py_compile $(git ls-files '*.py')

      - name: Lint with Flake8 (Syntax errors & undefined names)
        run: |
          # Dừng build nếu có lỗi cú pháp hoặc biến/module chưa định nghĩa
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Check Code Formatting with Black (Advisory)
        run: |
          black --check --diff . || true

  build-plugins:
    name: Build & Validate NetBox Plugins
    runs-on: ubuntu-latest
    needs: lint-and-syntax

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build wheel twine setuptools

      - name: Build Plugins
        run: |
          mkdir -p dist_artifacts
          PLUGINS=(
            "netbox-provinces-plugin"
            "netbox_access_request_plugin"
            "netbox_asset_management_plugin"
            "netbox_rack_layout_plugin"
            "netbox_smart_lock_plugin"
            "netbox_zabbix_plugin"
            "upload_file_plugin-production"
          )
          
          for plugin in "${PLUGINS[@]}"; do
            if [ -f "$plugin/setup.py" ]; then
              echo "=========================================="
              echo "Building package for: $plugin"
              echo "=========================================="
              cd "$plugin"
              python -m build --sdist --wheel --outdir ../dist_artifacts/
              cd ..
            fi
          done

      - name: Validate built distributions with Twine
        run: |
          twine check dist_artifacts/*

      - name: Upload Built Plugins Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: netbox-plugins-packages
          path: dist_artifacts/
          retention-days: 7

  docker-compose-validate:
    name: Validate Docker Compose Configuration
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare environment files from templates
        run: |
          cd netbox
          mkdir -p env
          if [ -d "env_example" ]; then
            cp env_example/netbox.env.example env/netbox.env 2>/dev/null || touch env/netbox.env
            cp env_example/postgres.env.example env/postgres.env 2>/dev/null || touch env/postgres.env
            cp env_example/redis.env.example env/redis.env 2>/dev/null || touch env/redis.env
            cp env_example/redis-cache.env.example env/redis-cache.env 2>/dev/null || touch env/redis-cache.env
          fi
          touch .env
          echo "VERSION=v3.7.8" >> .env

      - name: Validate docker-compose configuration
        run: |
          cd netbox
          docker compose config --quiet
          echo "Docker Compose configuration is valid!"
