name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  lint-and-syntax:
    name: Python Lint & Syntax Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 black

      - name: Check Python Syntax (Compile all .py files)
        run: |
          git ls-files -z '*.py' | xargs -0 -r python -m py_compile

      - name: Lint with Flake8 (Syntax errors & undefined names)
        run: |
          # Dừng build nếu có lỗi cú pháp hoặc biến/module chưa định nghĩa
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Check Code Formatting with Black (Advisory)
        run: |
          black --check --diff . || true

  build-plugins:
    name: Build & Validate NetBox Plugins
    runs-on: ubuntu-latest
    # Chạy song song độc lập với lint-and-syntax để tối ưu thời gian

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build wheel twine setuptools

      - name: Auto-Discover and Build All Plugins
        run: |
          mkdir -p dist_artifacts
          echo "==> Đang tự động quét các thư mục Plugin..."

          # Tự động tìm tất cả các thư mục con chứa setup.py hoặc pyproject.toml
          find . -maxdepth 2 -mindepth 2 \( -name "setup.py" -o -name "pyproject.toml" \) | while read -r config_file; do
            plugin_dir="$(dirname "$config_file")"
            plugin_name="$(basename "$plugin_dir")"

            # Bỏ qua các thư mục hệ thống / runner / venv nếu có
            if [ "$plugin_name" = "actions-runner" ] || [ "$plugin_name" = "netbox" ]; then
              continue
            fi

            echo "=========================================="
            echo "Phát hiện và đóng gói plugin: $plugin_name ($plugin_dir)"
            echo "=========================================="
            (cd "$plugin_dir" && python -m build --sdist --wheel --outdir "$GITHUB_WORKSPACE/dist_artifacts/")
          done

      - name: Validate built distributions with Twine
        run: |
          if ls dist_artifacts/* 1> /dev/null 2>&1; then
            twine check dist_artifacts/*
          else
            echo "Không có package nào cần kiểm tra."
          fi

      - name: Upload Built Plugins Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: netbox-plugins-packages
          path: dist_artifacts/
          retention-days: 7
          if-no-files-found: ignore

  docker-compose-validate:
    name: Validate Docker Compose Configuration
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Auto-Prepare All Environment Files
        run: |
          echo "==> [1/3] Tu dong copy cac file .example thanh .env tuong ung..."
          find . -type f \( -name "*.example" -o -name "*.env.example" \) | while read -r example_file; do
            target="${example_file%.example}"
            target_dir="$(dirname "$target" | sed 's|/env_example$|/env|')"
            target_file="$target_dir/$(basename "$target")"
            mkdir -p "$target_dir"
            cp -n "$example_file" "$target_file" 2>/dev/null || cp "$example_file" "$target_file"
          done

          echo "==> [2/3] Tu dong quet docker-compose.yml de tao tat ca file env_file con thieu..."
          cd netbox
          grep -oE '[a-zA-Z0-9_\.\/-]+\.env' docker-compose.yml | sort -u | while read -r env_path; do
            mkdir -p "$(dirname "$env_path")"
            if [ ! -f "$env_path" ]; then
              touch "$env_path"
              echo "  + Da tu dong tao file: $env_path"
            fi
          done

          echo "==> [3/3] Thiet lap phien ban NetBox mac dinh cho .env..."
          touch .env
          grep -q "VERSION=" .env 2>/dev/null || echo "VERSION=v4.0-2.9.1" >> .env

      - name: Validate docker-compose configuration
        run: |
          cd netbox
          docker compose config --quiet
          echo "Docker Compose configuration is valid!"

  deploy:
    name: Deploy to Local Server (Self-Hosted Runner)
    runs-on: self-hosted
    needs: [lint-and-syntax, build-plugins, docker-compose-validate]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')

    steps:
      - name: Deploy Docker Compose on Local Machine
        shell: powershell
        run: |
          Write-Host "==> [1/6] Cap nhat ma nguon tu GitHub (git fetch & reset)..."
          Set-Location -Path "d:\docker-netbox"
          git fetch origin main
          git reset --hard origin/main

          Write-Host "==> [2/6] Chuyen den thu muc cau hinh NetBox..."
          Set-Location -Path "d:\docker-netbox\netbox"

          Write-Host "==> [3/6] Rebuild va khoi dong lai container..."
          docker compose up -d --build --remove-orphans

          Write-Host "==> [4/6] Cho NetBox khoi dong va san sang ket noi (15s)..."
          Start-Sleep -Seconds 15

          Write-Host "==> [5/6] Chay Database Migration cho NetBox va cac Plugin..."
          docker compose exec -T netbox /opt/netbox/venv/bin/python /opt/netbox/netbox/manage.py migrate

          Write-Host "==> [6/6] Thu gom static files (CSS/JS) cho giao dien Plugins..."
          docker compose exec -T netbox /opt/netbox/venv/bin/python /opt/netbox/netbox/manage.py collectstatic --no-input

          Write-Host "==> Kiem tra trang thai cac container:"
          docker compose ps

          Write-Host "==> Trien khai tu dong tren may ca nhan thanh cong!"
